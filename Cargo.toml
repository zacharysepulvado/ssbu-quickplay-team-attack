[package]
name = "ssbu-quickplay-team-attack"
version = "0.3.2-alpha.10"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[package.metadata.skyline]
titleid = "01006A800016E000" # Super Smash Bros. Ultimate

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_os = "switch")'.dependencies]
skyline = "=0.6.0"
imgui-api = { git = "https://github.com/Coolsonickirby/imgui-api", rev = "9259902433138ec9c9ef9e4b152de01403f9456f" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("switch"))'] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
